name: Supabase Database

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-db.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Repair V3 baseline migration history
        if: github.ref_name == 'dev'
        shell: bash
        run: |
          set -u

          EXPECTED_PROJECT_REF="bqrwcgortfmjjdywqzqu"
          BASELINE_VERSION="20260815000000"

          if [ "$SUPABASE_PROJECT_ID" != "$EXPECTED_PROJECT_REF" ]; then
            echo "::error::Unexpected SUPABASE_PROJECT_ID=$SUPABASE_PROJECT_ID"
            exit 1
          fi

          extract_local() {
            while IFS='|' read -r local remote rest; do
              local="$(printf '%s' "$local" | tr -d '[:space:]')"
              if [[ "$local" =~ ^[0-9]{14}$ ]]; then
                printf '%s\n' "$local"
              fi
            done < "$1"
          }

          extract_remote() {
            while IFS='|' read -r local remote rest; do
              remote="$(printf '%s' "$remote" | tr -d '[:space:]')"
              if [[ "$remote" =~ ^[0-9]{14}$ ]]; then
                printf '%s\n' "$remote"
              fi
            done < "$1"
          }

          EXPECTED_BEFORE="$(cat <<'VERSIONS'
          20260815162400
          20260816121500
          20260816123700
          20260816135200
          20260816143500
          20260816154500
          20260817042000
          20260817080500
          20260817102500
          20260817104500
          20260817144000
          20260817162500
          20260818070000
          VERSIONS
          )"

          EXPECTED_AFTER="$(cat <<'VERSIONS'
          20260815000000
          20260815162400
          20260816121500
          20260816123700
          20260816135200
          20260816143500
          20260816154500
          20260817042000
          20260817080500
          20260817102500
          20260817104500
          20260817144000
          20260817162500
          20260818070000
          VERSIONS
          )"

          supabase migration list --linked | tee /tmp/k3-migrations-before.txt

          LOCAL_BEFORE="$(extract_local /tmp/k3-migrations-before.txt)"
          REMOTE_BEFORE="$(extract_remote /tmp/k3-migrations-before.txt)"

          if [ "$LOCAL_BEFORE" != "$EXPECTED_AFTER" ]; then
            echo "::error::Unexpected LOCAL migration history before repair"
            exit 1
          fi

          if [ "$REMOTE_BEFORE" = "$EXPECTED_BEFORE" ]; then
            echo "Baseline marker missing remotely. Recording historical marker only."
            supabase migration repair "$BASELINE_VERSION" --status applied --linked
          elif [ "$REMOTE_BEFORE" = "$EXPECTED_AFTER" ]; then
            echo "Baseline marker already exists remotely. Repair safely skipped."
          else
            echo "::error::Unexpected REMOTE migration history before repair"
            exit 1
          fi

          supabase migration list --linked | tee /tmp/k3-migrations-after.txt

          LOCAL_AFTER="$(extract_local /tmp/k3-migrations-after.txt)"
          REMOTE_AFTER="$(extract_remote /tmp/k3-migrations-after.txt)"

          if [ "$LOCAL_AFTER" != "$EXPECTED_AFTER" ]; then
            echo "::error::LOCAL migration history is not aligned after repair"
            exit 1
          fi

          if [ "$REMOTE_AFTER" != "$EXPECTED_AFTER" ]; then
            echo "::error::REMOTE migration history is not aligned after repair"
            exit 1
          fi

          echo "PHASE4_HISTORY_ALIGNMENT=SUCCESS"

      - name: Preview database migrations
        if: github.ref_name == 'dev'
        run: supabase db push --linked --dry-run

      - name: Deploy database migrations
        if: github.ref_name == 'main'
        run: supabase db push --linked
